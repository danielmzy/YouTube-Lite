name: Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android 36 platform and build tools
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          $sm = (Get-ChildItem "$sdk\cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1).FullName
          Write-Host "sdkmanager: $sm"
          1..30 | ForEach-Object { "y" } | & $sm --licenses | Out-Null
          & $sm "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        shell: cmd
        run: gradlew.bat assembleRelease

      - name: Sign APK
        shell: cmd
        run: >
          java -jar signer\apksigner.jar sign
          --key signer\apkeasytool.pk8
          --cert signer\apkeasytool.pem
          --v4-signing-enabled false
          --out app\build\outputs\apk\release\YouTubeLite-signed.apk
          app\build\outputs\apk\release\app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeLite-release
          path: app/build/outputs/apk/release/YouTubeLite-signed.apk
          if-no-files-found: error
