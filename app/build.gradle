apply plugin: 'com.android.application'

android {
    namespace "com.matr1x.youtubelite"  
    compileSdk 36

    defaultConfig {
        applicationId "com.matr1x.youtubelite"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Add your dependencies here
    implementation 'androidx.webkit:webkit:1.12.0'
}



